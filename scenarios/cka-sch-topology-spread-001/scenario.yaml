apiVersion: kops/v1alpha1
kind: Scenario
id: cka-sch-topology-spread-001
revision: 1
title: Replace node pinning with a topology spread constraint across racks
status: validated
family_id: PF-SCH-003
difficulty:
  level: 2
  rationale: Removing the pin alone looks fine at runtime, so the constraint itself is also checked.
tags:
- scheduling
- topologyspreadconstraints
- nodeselector
profiles:
  cka:
    enabled: true
    domain: workloads-scheduling
    primary_competency: CKA-WLS-05
    mapping_rationale: Scheduling constraints such as topology spread are part of Pod scheduling configuration.
  ckad:
    enabled: false
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 2
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    port:
      type: port
      min: 8000
      max: 8999
    ns:
      type: dns-label
      prefix: spr-
    app:
      type: choice
      choices:
      - frontend
      - cache-tier
      - edge-proxy
      - sessions
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Both workers carry rack=r1 / rack=r2. Deployment {{app}} (4 replicas) has nodeSelector rack=r1 so every pod sits on one worker.
  fixtures:
  - fixtures/web.yaml
  faults:
  - id: pinned_to_one_rack
    category: scheduling-constraint
    layer: object
    description: all replicas confined to rack r1
constraints:
- id: keep_replicas
  description: Keep 4 replicas.
  enforced_by: invariant
  invariant: replicas_unchanged
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: spread_enforced
  kind: goal
  required: true
  description: A DoNotSchedule topology spread constraint on key rack with maxSkew 1 selects the app's pods
- id: pods_spread
  kind: goal
  required: true
  description: The 4 pods run on both workers, at most 2 per node
- id: replicas_unchanged
  kind: guard
  required: true
  description: spec.replicas still 4
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - spread_enforced
    - pods_spread
    must_pass:
    - replicas_unchanged
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-unpin-only.sh
  - reference/wrong-soft-constraint.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
