apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-sch-topology-spread-001
criteria:
  - id: max_skew
    invariant: spread_enforced
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.topologySpreadConstraints[?(@.topologyKey=="rack")].maxSkew', op: eq, value: 1}

  - id: when_unsat
    invariant: spread_enforced
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.topologySpreadConstraints[?(@.topologyKey=="rack")].whenUnsatisfiable', op: eq, value: DoNotSchedule}

  - id: constraint_selector
    invariant: spread_enforced
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.topologySpreadConstraints[?(@.topologyKey=="rack")].labelSelector.matchLabels.app', op: eq, value: "{{app}}"}

  - id: no_pin
    invariant: spread_enforced
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.nodeSelector.rack', op: absent}

  - id: placement_even
    invariant: pods_spread
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.placement, namespace: "{{ns}}", selector: "app={{app}}", min_pods: 4, max_per_node: 2, min_distinct_nodes: 2}

  - id: replicas_four
    invariant: replicas_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.replicas', op: eq, value: 4}
