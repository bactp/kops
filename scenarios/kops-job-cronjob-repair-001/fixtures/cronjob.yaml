apiVersion: batch/v1
kind: CronJob
metadata: {name: "{{app}}-report", namespace: "{{ns}}"}
spec:
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36.11
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo {{marker}}"]
