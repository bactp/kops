apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-job-cronjob-repair-001
criteria:
  - id: cron_image
    invariant: cronjob_template_fixed
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}-report", namespace: "{{ns}}"}, jsonpath: '.spec.jobTemplate.spec.template.spec.containers[0].image', op: eq, value: busybox:1.36.1}

  - id: job_complete
    invariant: manual_run_completed
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.condition, resource: {kind: Job, name: "{{job}}", namespace: "{{ns}}"}, condition: Complete, status: "True"}

  - id: job_logs
    invariant: manual_run_completed
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.logs, resource: {kind: Job, name: "{{job}}", namespace: "{{ns}}"}, regex: "^{{marker}}$"}

  - id: cron_settings
    invariant: cron_settings_kept
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: CronJob, name: "{{app}}-report", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec.schedule, .spec.concurrencyPolicy, .spec.suspend], baseline: post-setup}
