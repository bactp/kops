 apiVersion: v1
 kind: Service
 metadata:
   name: {{app}}
   namespace: {{ns}}
 spec:
   selector: {app: {{app}}}
   ports:
     - {port: 80, targetPort: {{port}}}
---
 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{app}}
   namespace: {{ns}}
 spec:
   replicas: 1
   selector:
     matchLabels: {app: {{app}}}
   template:
     metadata:
       labels: {app: {{app}}}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command:
             - sh
             - -c
             - |
               if [ -z "$CACHE_HOST" ]; then echo "fatal: CACHE_HOST is not set" >&2; exit 3; fi
               if ! wget -q -T 3 -O /dev/null "http://$CACHE_HOST/"; then echo "fatal: cannot reach cache at $CACHE_HOST" >&2; exit 4; fi
               mkdir -p /tmp/w; echo cache-reachable > /tmp/w/index.html
               exec httpd -f -p {{port}} -h /tmp/w
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
