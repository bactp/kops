apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: {{app}}
  template:
    metadata:
      labels:
        app: {{app}}
        tier: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          imagePullPolicy: IfNotPresent
          args: ["netexec", "--http-port={{port}}"]
          ports:
            - containerPort: {{port}}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{port}}
            periodSeconds: 2
