 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{app}}
   namespace: {{ns}}
 spec:
   replicas: 1
   selector:
     matchLabels: {app: {{app}}}
   template:
     metadata:
       labels: {app: {{app}}}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command: ["sh", "-c", "mkdir -p /tmp/w && echo egress-ok > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
---
 apiVersion: v1
 kind: Service
 metadata:
   name: {{app}}
   namespace: {{ns}}
 spec:
   selector: {app: {{app}}}
   ports:
     - {port: 80, targetPort: {{port}}}
---
 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{other}}
   namespace: {{ns}}
 spec:
   replicas: 1
   selector:
     matchLabels: {app: {{other}}}
   template:
     metadata:
       labels: {app: {{other}}}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command: ["sh", "-c", "mkdir -p /tmp/w && echo secret-admin > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
---
 apiVersion: v1
 kind: Service
 metadata:
   name: {{other}}
   namespace: {{ns}}
 spec:
   selector: {app: {{other}}}
   ports:
     - {port: 80, targetPort: {{port}}}
