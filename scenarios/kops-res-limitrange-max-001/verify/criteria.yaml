apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-res-limitrange-max-001
criteria:
  - id: rollout_done
    invariant: pods_running
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.rollout_complete, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}}

  - id: two_running
    invariant: pods_running
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.count, resource: {kind: Pod, selector: "app={{app}}", namespace: "{{ns}}"}, field_filter: ".status.phase==Running", op: eq, value: 2}

  - id: limit_max
    invariant: limit_in_range
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[0].resources.limits.memory', op: qty_lte, value: "{{max}}Mi"}

  - id: limit_min
    invariant: limit_above_minimum
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[0].resources.limits.memory', op: qty_gte, value: "64Mi"}

  - id: limitrange
    invariant: limitrange_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: LimitRange, name: "{{app}}-limits", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec], baseline: post-setup}

  - id: replicas_two
    invariant: replicas_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.replicas', op: eq, value: 2}
