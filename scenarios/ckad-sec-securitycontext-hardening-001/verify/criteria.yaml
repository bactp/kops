apiVersion: kops/v1alpha1
kind: Criteria
scenario: ckad-sec-securitycontext-hardening-001
criteria:
  - id: hardened_behaviour
    invariant: hardened_context
    required: true
    settle: true
    failure_class: goal-not-reached
    check:
      type: net.http
      from: {namespace: kops-probe}
      url: "http://{{app}}.{{ns}}.svc.cluster.local/"
      expect: reachable
      status: 200
      body_regex: '^uid={{uid}} nnp=1 capbnd=0+ rootfs=ro\s*$'
      attempts: 5
      timeout_seconds: 3

  - id: rollout_done
    invariant: app_still_serves
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.rollout_complete, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}}

  - id: serves_http
    invariant: app_still_serves
    required: true
    settle: true
    failure_class: goal-not-reached
    check:
      type: net.http
      from: {namespace: kops-probe}
      url: "http://{{app}}.{{ns}}.svc.cluster.local/"
      expect: reachable
      status: 200
      body_regex: '^uid='
      attempts: 5
      timeout_seconds: 3
