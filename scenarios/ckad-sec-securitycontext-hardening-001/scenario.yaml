apiVersion: kops/v1alpha1
kind: Scenario
id: ckad-sec-securitycontext-hardening-001
revision: 1
title: Harden a Deployment with a restrictive securityContext without breaking it
status: validated
family_id: PF-SEC-005
difficulty:
  level: 3
  rationale: Setting the context is easy; the read-only root filesystem breaks the app and needs a writable emptyDir, so the result is checked behaviourally.
tags:
- securitycontext
- readonlyrootfilesystem
- capabilities
- emptydir
profiles:
  cka:
    enabled: false
  ckad:
    enabled: true
    domain: environment-config-security
    primary_competency: CKAD-AEC-08
    mapping_rationale: SecurityContexts and capabilities.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: hard-
    app:
      type: choice
      choices:
      - fileserver
      - webhook
      - gateway
      - notifier
    port:
      type: port
      min: 8000
      max: 8999
    uid:
      type: choice
      choices:
      - 10001
      - 10100
      - 20202
      - 31337
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Deployment {{app}} (2 replicas) runs as root with a writable root filesystem; its start-up script writes its page into /tmp/site and the page reports uid, no_new_privs flag, bounding capability set and whether / is writable.
  fixtures:
  - fixtures/service.yaml
  - fixtures/deployment.yaml
  faults:
  - id: running_as_root
    category: misconfiguration
    layer: object
    description: no securityContext at all
constraints:
- id: keep_service
  description: The application must keep serving through its Service.
  enforced_by: invariant
  invariant: app_still_serves
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: hardened_context
  kind: goal
  required: true
  description: Pods run as non-root uid {{uid}}, read-only root fs, no privilege escalation, all capabilities dropped
- id: app_still_serves
  kind: goal
  required: true
  description: The application is ready and serves HTTP 200 through its Service
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - hardened_context
    must_pass:
    - app_still_serves
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-context-only.sh
  - reference/wrong-partial.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
