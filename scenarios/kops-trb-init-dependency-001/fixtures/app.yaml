apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      initContainers:
        - name: wait-for-dependency
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -T 2 -O /dev/null http://{{dep}}:{{dport}}/; do echo "waiting for {{dep}}:{{dport}}"; sleep 2; done
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /tmp/w; echo ready > /tmp/w/index.html; exec httpd -f -p {{port}} -h /tmp/w"]
          readinessProbe:
            tcpSocket: {port: {{port}}}
            periodSeconds: 2
