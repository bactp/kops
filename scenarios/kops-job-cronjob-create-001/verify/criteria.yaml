apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-job-cronjob-create-001
criteria:
  - id: schedule
    invariant: cronjob_configured
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.schedule', op: eq, value: "{{sched}}"}

  - id: image
    invariant: cronjob_configured
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.jobTemplate.spec.template.spec.containers[0].image', op: eq, value: busybox:1.36.1}

  - id: concurrency
    invariant: cronjob_configured
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.concurrencyPolicy', op: eq, value: Forbid}

  - id: success_history
    invariant: cronjob_configured
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.successfulJobsHistoryLimit', op: eq, value: 2}

  - id: failed_history
    invariant: cronjob_configured
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: CronJob, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.failedJobsHistoryLimit', op: eq, value: 1}

  - id: job_complete
    invariant: manual_run_completed
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.condition, resource: {kind: Job, name: "{{app}}-now", namespace: "{{ns}}"}, condition: Complete, status: "True"}

  - id: job_logs
    invariant: manual_run_completed
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.logs, resource: {kind: Job, name: "{{app}}-now", namespace: "{{ns}}"}, regex: "^{{marker}}$"}
