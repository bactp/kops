apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-net-coredns-two-layer-repair-001
criteria:
  - id: kubernetes_svc_resolves
    invariant: cluster_dns_works
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: net.dns, from: {namespace: kops-probe}, name: kubernetes.default.svc.cluster.local, expect: resolves, answer_regex: "10\\.96\\.0\\.1"}

  - id: kube_dns_endpoints
    invariant: cluster_dns_works
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.endpoints, service: kube-dns, namespace: kube-system, min_ready: 1, port: 53}

  - id: corefile_forward
    invariant: dns_config_intact
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: ConfigMap, name: coredns, namespace: kube-system}, jsonpath: '.data.Corefile', op: regex, value: 'forward \. /etc/resolv\.conf'}

  - id: kube_dns_identity
    invariant: dns_config_intact
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Service, name: kube-dns, namespace: kube-system}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec.clusterIP], baseline: post-setup}
