apiVersion: batch/v1
kind: CronJob
metadata: {name: "{{app}}", namespace: "{{ns}}"}
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 3; echo {{marker}}"]
            - name: shipper
              image: busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command: ["sleep", "3600"]
