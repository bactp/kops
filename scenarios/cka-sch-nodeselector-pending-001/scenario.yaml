apiVersion: kops/v1alpha1
kind: Scenario
id: cka-sch-nodeselector-pending-001
revision: 1
title: Fix a Deployment stuck Pending on a node selector that matches no node
status: validated
family_id: PF-SCH-005
difficulty:
  level: 2
  rationale: The scheduler event names the problem; the real value must be read from node labels, and relabelling nodes or dropping the selector are blocked.
tags:
- scheduling
- nodeselector
- pending
- labels
profiles:
  cka:
    enabled: true
    domain: workloads-scheduling
    primary_competency: CKA-WLS-05
    mapping_rationale: Configuring Pod scheduling constraints (nodeSelector) so that pods are admitted onto suitable nodes.
  ckad:
    enabled: false
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 2
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    port:
      type: port
      min: 8000
      max: 8999
    ns:
      type: dns-label
      prefix: sched-
    app:
      type: choice
      choices:
      - renderer
      - batcher
      - trainer
      - encoder
    pool:
      type: choice
      choices:
      - gpu-batch
      - highmem
      - ssd-fast
      - arm-lab
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Two workers are labelled pool=general and pool={{pool}}. Deployment {{app}} (3 replicas) has nodeSelector pool={{pool}}-v2, which no node carries, so all pods are Pending.
  fixtures:
  - fixtures/web.yaml
  faults:
  - id: nodeselector_mismatch
    category: scheduling-constraint
    layer: object
    description: nodeSelector value matches no node
constraints:
- id: labels_untouched
  description: Do not change node labels.
  enforced_by: invariant
  invariant: node_labels_unchanged
- id: keep_replicas
  description: Keep 3 replicas.
  enforced_by: invariant
  invariant: replicas_unchanged
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: pods_on_pool_nodes
  kind: goal
  required: true
  description: All 3 pods run, and only on nodes labelled pool={{pool}}
- id: node_labels_unchanged
  kind: guard
  required: true
  description: Exactly one node has pool={{pool}} and one has pool=general
- id: replicas_unchanged
  kind: guard
  required: true
  description: spec.replicas still 3
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - pods_on_pool_nodes
    must_pass:
    - node_labels_unchanged
    - replicas_unchanged
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-relabel-all.sh
  - reference/wrong-drop-selector.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
