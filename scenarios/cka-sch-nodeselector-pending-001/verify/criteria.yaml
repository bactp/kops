apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-sch-nodeselector-pending-001
criteria:
  - id: placement_on_pool
    invariant: pods_on_pool_nodes
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.placement, namespace: "{{ns}}", selector: "app={{app}}", min_pods: 3, node_selector: "pool={{pool}}", mode: within}

  - id: one_pool_node
    invariant: node_labels_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.count, resource: {kind: Node, selector: "pool={{pool}}"}, op: eq, value: 1}

  - id: one_general_node
    invariant: node_labels_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.count, resource: {kind: Node, selector: "pool=general"}, op: eq, value: 1}

  - id: replicas_three
    invariant: replicas_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.replicas', op: eq, value: 3}
