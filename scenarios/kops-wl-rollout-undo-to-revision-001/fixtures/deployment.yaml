apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 3
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /www && echo \"$MSG\" > /www/index.html && echo ok > /www/healthz && exec httpd -f -p {{port}} -h /www"]
          env:
            - {name: MSG, value: "{{color}}-1"}
          readinessProbe:
            httpGet: {path: /healthz, port: {{port}}}
            periodSeconds: 2
