apiVersion: kops/v1alpha1
kind: Scenario
id: kops-wl-rollout-undo-to-revision-001
revision: 1
title: Roll a stuck Deployment back to a specific earlier release
status: validated
family_id: PF-WKL-003
difficulty:
  level: 2
  rationale: The latest rollout is stuck, but the obvious rollback target (previous revision) is the wrong one; the right revision must be found in the rollout history.
tags:
- deployment
- rollout
- rollback
- history
profiles:
  cka:
    enabled: true
    domain: workloads-scheduling
    primary_competency: CKA-WLS-01
    mapping_rationale: Rollback to a specific revision is the rolling-update and rollback competency itself.
  ckad:
    enabled: true
    domain: deployment
    primary_competency: CKAD-ADP-02
    mapping_rationale: Operating a Deployment rollout and reverting it is the Deployments/rolling-updates competency.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: rel-
    app:
      type: choice
      choices:
      - ledger
      - storefront
      - quotes
      - invoicer
    port:
      type: port
      min: 8000
      max: 8999
    color:
      type: choice
      choices:
      - amber
      - cobalt
      - jade
      - crimson
      - violet
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: 'Deployment {{app}} (3 replicas) went through three revisions: revision 1 serves the banner {{color}}-1, revision 2 serves {{color}}-2, revision 3 points at a non-existent image tag and its pods never start (rollout stuck, old pods still serve revision 2). Service {{app}} fronts it.'
  fixtures:
  - fixtures/deployment.yaml
  - fixtures/service.yaml
  faults:
  - id: bad_image_revision
    category: image
    layer: object
    description: Latest revision references an image tag that does not exist
  - id: wrong_obvious_rollback
    category: misconfiguration
    layer: object
    description: Previous revision (2) is healthy but serves the wrong banner
constraints:
- id: keep_deployment
  description: Do not delete and re-create the Deployment (its rollout history must survive).
  enforced_by: invariant
  invariant: deployment_not_recreated
- id: keep_replicas
  description: Keep 3 replicas.
  enforced_by: invariant
  invariant: replicas_unchanged
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: original_release_served
  kind: goal
  required: true
  description: Clients receive the banner of revision 1 through the Service
- id: rollout_healthy
  kind: goal
  required: true
  description: Deployment rollout complete with all replicas ready
- id: deployment_not_recreated
  kind: guard
  required: true
  description: Deployment UID unchanged
- id: replicas_unchanged
  kind: guard
  required: true
  description: spec.replicas still 3
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - original_release_served
    - rollout_healthy
    must_pass:
    - deployment_not_recreated
    - replicas_unchanged
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-undo-previous.sh
  - reference/wrong-recreate.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
