apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec httpd -f -p {{port}} -h /etc/podinfo"]
          volumeMounts:
            - {name: podinfo, mountPath: /etc/podinfo}
          readinessProbe:
            tcpSocket: {port: {{port}}}
            periodSeconds: 2
      volumes:
        - {name: podinfo, emptyDir: {}}
