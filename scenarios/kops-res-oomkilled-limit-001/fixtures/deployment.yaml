apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              x=$(head -c 40000000 /dev/zero | tr '\000' a)
              mkdir -p /www; echo ok > /www/index.html
              httpd -f -p {{port}} -h /www
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 64Mi}
