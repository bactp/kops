apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: "{{ns}}"}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-clients, namespace: "{{ns}}"}
spec:
  podSelector:
    matchLabels: {app: "{{app}}"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: "{{wrong}}"}
      ports:
        - {protocol: TCP, port: 80}
