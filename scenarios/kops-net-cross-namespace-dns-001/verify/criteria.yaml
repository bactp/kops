apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-net-cross-namespace-dns-001
criteria:
  - id: recent_ok
    invariant: client_succeeds
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.logs, resource: {kind: Pod, selector: "app=client", namespace: "{{ns}}"}, regex: "^OK ", tail: 3, min_matches: 2}

  - id: recent_no_fail
    invariant: client_succeeds
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.logs, resource: {kind: Pod, selector: "app=client", namespace: "{{ns}}"}, regex: "^FAIL ", tail: 3, expect: no_match}

  - id: backend_dep
    invariant: backend_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Deployment, name: "{{svc}}", namespace: "{{ns}}-backend"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec], baseline: post-setup}

  - id: backend_svc
    invariant: backend_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Service, name: "{{svc}}", namespace: "{{ns}}-backend"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec], baseline: post-setup}

  - id: no_local_clusterip_lookalike
    invariant: no_local_lookalike
    required: true
    failure_class: constraint-violation
    check: {type: k8s.count, resource: {kind: Service, namespace: "{{ns}}"}, field_filter: ".spec.type==ClusterIP", op: eq, value: 0}
