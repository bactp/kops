apiVersion: kops/v1alpha1
kind: Scenario
id: kops-net-cross-namespace-dns-001
revision: 1
title: Fix a client that calls a Service in another namespace by its short name
status: validated
family_id: PF-NET-010
difficulty:
  level: 2
  rationale: The cause (short names resolve only inside the caller's namespace) is found from the client's logs; the shortcut of creating a lookalike Service must not work.
tags:
- dns
- service-discovery
- logs
- cross-namespace
profiles:
  cka:
    enabled: true
    domain: services-networking
    primary_competency: CKA-NET-06
    mapping_rationale: Service DNS names and how CoreDNS resolves them across namespaces.
  ckad:
    enabled: true
    domain: services-networking
    primary_competency: CKAD-SNW-02
    mapping_rationale: Troubleshooting access to an application through a Service.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: cli-
    svc:
      type: choice
      choices:
      - pricing
      - inventory-api
      - geo-lookup
      - quotes-api
    port:
      type: port
      min: 8000
      max: 8999
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Backend Service {{svc}} lives in namespace {{ns}}-backend. Deployment client in {{ns}} loops over wget "$TARGET" with TARGET=http://{{svc}}/ (short name), prints OK/FAIL lines.
  fixtures:
  - fixtures/backend.yaml
  - fixtures/client.yaml
  faults:
  - id: short_name_cross_ns
    category: wrong-reference
    layer: network
    description: client uses a short Service name that only resolves in its own namespace
constraints:
- id: backend_untouched
  description: Do not modify or move the backend.
  enforced_by: invariant
  invariant: backend_unchanged
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: client_succeeds
  kind: goal
  required: true
  description: The client's recent log lines show successful calls and no failures
- id: backend_unchanged
  kind: guard
  required: true
  description: Backend Deployment and Service unchanged
- id: no_local_lookalike
  kind: guard
  required: true
  description: No Service named {{svc}} with local endpoints was created in the client namespace
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - client_succeeds
    must_pass:
    - backend_unchanged
    - no_local_lookalike
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-local-lookalike.sh
  - reference/wrong-wrong-namespace.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
