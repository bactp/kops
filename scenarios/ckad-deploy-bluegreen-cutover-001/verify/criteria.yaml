apiVersion: kops/v1alpha1
kind: Criteria
scenario: ckad-deploy-bluegreen-cutover-001
criteria:
  - id: banner_green
    invariant: green_serves
    required: true
    settle: true
    failure_class: goal-not-reached
    check:
      type: net.http
      from: {namespace: kops-probe}
      url: "http://{{app}}.{{ns}}.svc.cluster.local/"
      expect: reachable
      status: 200
      body_regex: '^green-{{v2}}\s*$'
      attempts: 5
      timeout_seconds: 3

  - id: green_ready_pods
    invariant: green_ready
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.count, resource: {kind: Pod, selector: "app={{app}},track=green", namespace: "{{ns}}"}, field_filter: ".status.containerStatuses[0].ready==true", op: eq, value: 3}

  - id: blue_replicas
    invariant: blue_kept
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}-blue", namespace: "{{ns}}"}, jsonpath: '.spec.replicas', op: eq, value: 3}

  - id: blue_uid
    invariant: blue_kept
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Deployment, name: "{{app}}-blue", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid], baseline: post-setup}

  - id: svc_uid
    invariant: service_identity_preserved
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Service, name: "{{app}}", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec.clusterIP], baseline: post-setup}
