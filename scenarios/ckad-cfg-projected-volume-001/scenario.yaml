apiVersion: kops/v1alpha1
kind: Scenario
id: ckad-cfg-projected-volume-001
revision: 1
title: Merge a ConfigMap and a Secret into one directory with a projected volume
status: validated
family_id: PF-CFG-003
difficulty:
  level: 2
  rationale: Needs replacing a single-source volume with a projected one (JSON patch) and verifying both files through the application.
tags:
- projected-volume
- configmap
- secret
- volumes
profiles:
  cka:
    enabled: false
  ckad:
    enabled: true
    domain: design-build
    primary_competency: CKAD-ADB-04
    mapping_rationale: Utilizing ephemeral and projected volumes.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: proj-
    app:
      type: choice
      choices:
      - viewer
      - docsite
      - briefing
      - kiosk
    port:
      type: port
      min: 8000
      max: 8999
    tok:
      type: choice
      choices:
      - tk-7f21-aa
      - tk-93be-c1
      - tk-0d5e-91
      - tk-ae44-3b
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Deployment {{app}} serves /etc/site, currently a plain ConfigMap volume (index.html). Secret {{app}}-token (key token) exists but is not mounted.
  fixtures:
  - fixtures/service.yaml
  - fixtures/deployment.yaml
  faults:
  - id: secret_not_mounted
    category: missing-resource
    layer: object
    description: the Secret is not part of the served directory
constraints:
- id: keep_mount
  description: Keep the image and the /etc/site mount path.
  enforced_by: invariant
  invariant: mount_unchanged
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: index_served
  kind: goal
  required: true
  description: GET /index.html returns the ConfigMap content
- id: token_served
  kind: goal
  required: true
  description: GET /token.txt returns the Secret's token
- id: mount_unchanged
  kind: guard
  required: true
  description: Image and mount path unchanged
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - token_served
    must_pass:
    - index_served
    - mount_unchanged
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-second-mount.sh
  - reference/wrong-wrong-filename.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
