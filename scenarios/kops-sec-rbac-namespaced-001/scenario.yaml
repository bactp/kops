apiVersion: kops/v1alpha1
kind: Scenario
id: kops-sec-rbac-namespaced-001
revision: 1
title: Give a ServiceAccount read-only access to a few resources in one namespace
status: validated
family_id: PF-SEC-001
difficulty:
  level: 2
  rationale: 'Creation task whose real difficulty is least privilege: a broad built-in role would be easier but over-grants.'
tags:
- rbac
- role
- rolebinding
- serviceaccount
- least-privilege
profiles:
  cka:
    enabled: true
    domain: cluster-architecture
    primary_competency: CKA-ARC-01
    mapping_rationale: Creating Roles and RoleBindings is the RBAC competency.
  ckad:
    enabled: true
    domain: environment-config-security
    primary_competency: CKAD-AEC-02
    mapping_rationale: Authorization (RBAC for a workload identity) is part of authentication, authorization and admission control.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: ops-
    sa:
      type: choice
      choices:
      - log-reader
      - auditor-bot
      - inspector
      - status-agent
    extra:
      type: choice
      choices:
      - configmaps
      - endpoints
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Namespace {{ns}} contains ServiceAccount {{sa}} with no permissions, plus a few pods. Nothing grants it access.
  fixtures: []
  faults:
  - id: no_access
    category: permission
    layer: object
    description: ServiceAccount has no Role bindings
constraints:
- id: least_privilege
  description: Grant only what is requested, only inside the namespace.
  enforced_by: invariant
  invariant: no_excess_access
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: read_access_granted
  kind: goal
  required: true
  description: ServiceAccount can get/list/watch pods, read pod logs and get/list the extra resource in the namespace
- id: no_excess_access
  kind: guard
  required: true
  description: ServiceAccount cannot write, read secrets, list deployments, see other namespaces or nodes
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - read_access_granted
    must_pass:
    - no_excess_access
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-cluster-admin.sh
  - reference/wrong-view-role.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
