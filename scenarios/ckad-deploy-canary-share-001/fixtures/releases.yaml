apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}-stable
  namespace: {{ns}}
spec:
  replicas: 4
  selector:
    matchLabels: {app: {{app}}, track: stable}
  template:
    metadata:
      labels: {app: {{app}}, track: stable}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /tmp/w && echo stable > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
          readinessProbe:
            tcpSocket: {port: {{port}}}
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}-canary
  namespace: {{ns}}
spec:
  replicas: 0
  selector:
    matchLabels: {app: {{app}}, track: canary}
  template:
    metadata:
      labels: {app: {{app}}, track: canary}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /tmp/w && echo canary > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
          readinessProbe:
            tcpSocket: {port: {{port}}}
            periodSeconds: 2
