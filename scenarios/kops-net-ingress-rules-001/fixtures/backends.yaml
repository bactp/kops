 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{app}}-api
   namespace: {{ns}}
 spec:
   replicas: 1
   selector:
     matchLabels: {app: {{app}}-api}
   template:
     metadata:
       labels: {app: {{app}}-api}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command: ["sh", "-c", "mkdir -p /tmp/w && echo api-ok > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
---
 apiVersion: v1
 kind: Service
 metadata:
   name: {{app}}-api
   namespace: {{ns}}
 spec:
   selector: {app: {{app}}-api}
   ports:
     - {port: 80, targetPort: {{port}}}
---
 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{app}}-web
   namespace: {{ns}}
 spec:
   replicas: 1
   selector:
     matchLabels: {app: {{app}}-web}
   template:
     metadata:
       labels: {app: {{app}}-web}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command: ["sh", "-c", "mkdir -p /tmp/w && echo web-ok > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
---
 apiVersion: v1
 kind: Service
 metadata:
   name: {{app}}-web
   namespace: {{ns}}
 spec:
   selector: {app: {{app}}-web}
   ports:
     - {port: 80, targetPort: {{port}}}
