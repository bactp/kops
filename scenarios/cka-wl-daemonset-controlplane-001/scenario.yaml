apiVersion: kops/v1alpha1
kind: Scenario
id: cka-wl-daemonset-controlplane-001
revision: 1
title: Run a node agent DaemonSet on every node including the tainted control plane
status: validated
family_id: PF-WKL-007
difficulty:
  level: 2
  rationale: Needs the control-plane taint understood and tolerated; removing the taint is the blocked shortcut.
tags:
- daemonset
- tolerations
- control-plane
profiles:
  cka:
    enabled: true
    domain: workloads-scheduling
    primary_competency: CKA-WLS-04
    mapping_rationale: DaemonSets are one of the workload primitives for robust per-node agents.
  ckad:
    enabled: false
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 1
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: node-
    app:
      type: choice
      choices:
      - logshipper
      - diag-agent
      - node-probe
      - auditd
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Cluster has 1 control-plane (tainted) and 1 worker. DaemonSet {{app}} has no tolerations, so it only runs on the worker.
  fixtures:
  - fixtures/ds.yaml
  faults:
  - id: untolerated_controlplane_taint
    category: scheduling-constraint
    layer: object
    description: DaemonSet lacks a toleration for node-role.kubernetes.io/control-plane
constraints:
- id: keep_taint
  description: The control-plane taint must stay.
  enforced_by: invariant
  invariant: taint_intact
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: agent_on_all_nodes
  kind: goal
  required: true
  description: DaemonSet has 2 ready pods on 2 distinct nodes
- id: taint_intact
  kind: guard
  required: true
  description: Control-plane node still has its NoSchedule taint
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - agent_on_all_nodes
    must_pass:
    - taint_intact
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-remove-taint.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
