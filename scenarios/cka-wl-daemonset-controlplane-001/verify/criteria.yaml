apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-wl-daemonset-controlplane-001
criteria:
  - id: desired_two
    invariant: agent_on_all_nodes
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: DaemonSet, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.status.desiredNumberScheduled', op: eq, value: 2}

  - id: ready_two
    invariant: agent_on_all_nodes
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: DaemonSet, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.status.numberReady', op: eq, value: 2}

  - id: two_nodes
    invariant: agent_on_all_nodes
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.placement, namespace: "{{ns}}", selector: "app={{app}}", min_pods: 2, min_distinct_nodes: 2}

  - id: cp_taint
    invariant: taint_intact
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Node, selector: "node-role.kubernetes.io/control-plane"}, jsonpath: '.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].effect', op: eq, value: NoSchedule}
