apiVersion: apps/v1
kind: DaemonSet
metadata: {name: "{{app}}", namespace: "{{ns}}"}
spec:
  selector:
    matchLabels: {app: "{{app}}"}
  template:
    metadata:
      labels: {app: "{{app}}"}
    spec:
      containers:
        - name: agent
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sleep", "3600"]
