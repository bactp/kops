apiVersion: kops/v1alpha1
kind: Scenario
id: cka-sto-default-class-001
revision: 1
title: Make a different StorageClass the only cluster default
status: validated
family_id: PF-STO-001
difficulty:
  level: 2
  rationale: 'Needs both sides of the default switch: promote the new class and demote the existing one; two defaults are ambiguous.'
tags:
- storageclass
- default-class
- annotations
profiles:
  cka:
    enabled: true
    domain: storage
    primary_competency: CKA-STO-01
    mapping_rationale: Implementing storage classes, including which one provisions volumes by default.
  ckad:
    enabled: false
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: sc-
    sc:
      type: choice
      choices:
      - fast-local
      - retained-local
      - bulk-local
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: The cluster has StorageClass standard (default, rancher.io/local-path) and a second class {{sc}} with the same provisioner (reclaimPolicy Retain). Only standard is default.
  fixtures:
  - fixtures/sc.yaml
  faults:
  - id: wrong_default
    category: misconfiguration
    layer: storage
    description: the default class is not the intended one
constraints:
- id: keep_classes
  description: Do not delete any StorageClass.
  enforced_by: invariant
  invariant: classes_present
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: new_default
  kind: goal
  required: true
  description: StorageClass {{sc}} is the default class
- id: single_default
  kind: goal
  required: true
  description: The old default no longer carries the default marker
- id: exactly_one_default
  kind: guard
  required: true
  description: Exactly one StorageClass is marked default
- id: classes_present
  kind: guard
  required: true
  description: Both StorageClasses still exist
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - new_default
    - single_default
    must_pass:
    - exactly_one_default
    - classes_present
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-two-defaults.sh
  - reference/wrong-demote-only.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
