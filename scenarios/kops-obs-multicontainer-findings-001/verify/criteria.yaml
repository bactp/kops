apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-obs-multicontainer-findings-001
criteria:
  - id: container_name
    invariant: findings_recorded
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: ConfigMap, name: "{{app}}-findings", namespace: "{{ns}}"}, jsonpath: '.data.container', op: eq, value: "{{bad}}"}

  - id: exit_code
    invariant: findings_recorded
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: ConfigMap, name: "{{app}}-findings", namespace: "{{ns}}"}, jsonpath: '.data.exitCode', op: eq, value: "{{code}}"}

  - id: workload
    invariant: workload_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec], baseline: post-setup}
