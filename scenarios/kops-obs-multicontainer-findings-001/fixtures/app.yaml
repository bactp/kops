apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /tmp/w; echo ok > /tmp/w/index.html; exec httpd -f -p {{port}} -h /tmp/w"]
        - name: "{{bad}}"
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo 'error: {{reason}}'; sleep 1; exit {{code}}"]
        - name: metrics
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sleep", "3600"]
