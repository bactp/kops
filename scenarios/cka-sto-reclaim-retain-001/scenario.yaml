apiVersion: kops/v1alpha1
kind: Scenario
id: cka-sto-reclaim-retain-001
revision: 1
title: Protect the data behind one claim by setting the reclaim policy of its PersistentVolume
status: validated
family_id: PF-STO-003
difficulty:
  level: 2
  rationale: The volume behind the claim must be identified from the claim; changing the other volume or both is blocked.
tags:
- pv
- reclaim-policy
- retain
- pvc
profiles:
  cka:
    enabled: true
    domain: storage
    primary_competency: CKA-STO-02
    mapping_rationale: Configuring reclaim policies of volumes.
  ckad:
    enabled: false
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: keep-
    app:
      type: choice
      choices:
      - ledger
      - catalog
      - media
      - orders
    d:
      type: choice
      choices:
      - alpha
      - delta
      - omega
    c:
      type: choice
      choices:
      - bravo
      - sigma
      - zeta
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: PVs {{app}}-pv-{{d}} and {{app}}-pv-{{c}} (both reclaim Delete) are bound to PVCs {{app}}-data and {{app}}-cache respectively.
  fixtures:
  - fixtures/volumes.yaml
  faults:
  - id: volume_would_be_deleted
    category: data-loss-risk
    layer: storage
    description: reclaim policy Delete on the data volume
constraints:
- id: only_data_volume
  description: Change only the volume that backs the data claim.
  enforced_by: invariant
  invariant: cache_volume_untouched
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: data_volume_retained
  kind: goal
  required: true
  description: The PV bound to claim {{app}}-data has reclaim policy Retain
- id: cache_volume_untouched
  kind: guard
  required: true
  description: The PV bound to {{app}}-cache still has reclaim policy Delete
- id: claims_bound
  kind: guard
  required: true
  description: Both claims remain Bound
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - data_volume_retained
    must_pass:
    - cache_volume_untouched
    - claims_bound
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-both-volumes.sh
  - reference/wrong-wrong-volume.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
