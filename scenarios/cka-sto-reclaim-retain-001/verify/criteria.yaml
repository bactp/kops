apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-sto-reclaim-retain-001
criteria:
  - id: data_pv_retain
    invariant: data_volume_retained
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: PersistentVolume, name: "{{app}}-pv-{{d}}"}, jsonpath: '.spec.persistentVolumeReclaimPolicy', op: eq, value: Retain}

  - id: cache_pv_delete
    invariant: cache_volume_untouched
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: PersistentVolume, name: "{{app}}-pv-{{c}}"}, jsonpath: '.spec.persistentVolumeReclaimPolicy', op: eq, value: Delete}

  - id: data_bound
    invariant: claims_bound
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: PersistentVolumeClaim, name: "{{app}}-data", namespace: "{{ns}}"}, jsonpath: '.status.phase', op: eq, value: Bound}

  - id: cache_bound
    invariant: claims_bound
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: PersistentVolumeClaim, name: "{{app}}-cache", namespace: "{{ns}}"}, jsonpath: '.status.phase', op: eq, value: Bound}
