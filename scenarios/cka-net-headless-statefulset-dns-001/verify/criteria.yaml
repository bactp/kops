apiVersion: kops/v1alpha1
kind: Criteria
scenario: cka-net-headless-statefulset-dns-001
criteria:
  - id: clusterip_none
    invariant: headless_dns
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Service, name: "{{svc}}", namespace: "{{ns}}"}, jsonpath: '.spec.clusterIP', op: eq, value: None}

  - id: dns_returns_both_pods
    invariant: headless_dns
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: net.dns, from: {namespace: kops-probe}, name: "{{svc}}.{{ns}}.svc.cluster.local", expect: resolves, answer_regex: "(Address: 10\\.244\\.[0-9]+\\.[0-9]+[\\s\\S]*){2}"}

  - id: dns_pod0
    invariant: pod_names_resolve
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: net.dns, from: {namespace: kops-probe}, name: "{{svc}}-0.{{svc}}.{{ns}}.svc.cluster.local", expect: resolves}

  - id: dns_pod1
    invariant: pod_names_resolve
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: net.dns, from: {namespace: kops-probe}, name: "{{svc}}-1.{{svc}}.{{ns}}.svc.cluster.local", expect: resolves}

  - id: sts_unchanged
    invariant: statefulset_untouched
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: StatefulSet, name: "{{svc}}", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.metadata.uid, .spec.serviceName, .spec.replicas, .spec.template], baseline: post-setup}
