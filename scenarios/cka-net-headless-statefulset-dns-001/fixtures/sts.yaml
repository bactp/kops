apiVersion: apps/v1
kind: StatefulSet
metadata: {name: "{{svc}}", namespace: "{{ns}}"}
spec:
  serviceName: "{{svc}}"
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: "{{svc}}"}
  template:
    metadata:
      labels: {app: "{{svc}}"}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /tmp/w; echo $(hostname) > /tmp/w/index.html; exec httpd -f -p {{port}} -h /tmp/w"]
          readinessProbe:
            tcpSocket: {port: {{port}}}
            periodSeconds: 2
