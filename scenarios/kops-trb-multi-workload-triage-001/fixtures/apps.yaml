 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: {{a}}
   namespace: {{ns}}
 spec:
   replicas: 2
   selector:
     matchLabels: {app: {{a}}}
   template:
     metadata:
       labels: {app: {{a}}}
     spec:
       containers:
         - name: web
           image: busybox:1.36.1
           imagePullPolicy: IfNotPresent
           command: ["sh", "-c", "mkdir -p /tmp/w && echo {{a}}-ok > /tmp/w/index.html && exec httpd -f -p {{port}} -h /tmp/w"]
           readinessProbe:
             tcpSocket: {port: {{port}}}
             periodSeconds: 2
---
 apiVersion: v1
 kind: Service
 metadata:
   name: {{a}}
   namespace: {{ns}}
 spec:
   selector: {app: {{a}}}
   ports:
     - {port: 80, targetPort: {{port}}}
