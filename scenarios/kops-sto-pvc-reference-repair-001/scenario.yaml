apiVersion: kops/v1alpha1
kind: Scenario
id: kops-sto-pvc-reference-repair-001
revision: 1
title: Point a Deployment at the existing claim that holds its saved data
status: validated
family_id: PF-STO-002
difficulty:
  level: 2
  rationale: Two similar claims exist; the one with the data must be found, and re-pointing to the empty one or to an emptyDir is the blocked shortcut.
tags:
- pvc
- volume
- pending
- persistence
profiles:
  cka:
    enabled: true
    domain: storage
    primary_competency: CKA-STO-03
    mapping_rationale: Working with PersistentVolumeClaims and the pods that use them.
  ckad:
    enabled: true
    domain: design-build
    primary_competency: CKAD-ADB-04
    mapping_rationale: Persistent volumes in application design.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: vol-
    app:
      type: choice
      choices:
      - notebook
      - ledger-web
      - uploads
      - archive-ui
    port:
      type: port
      min: 8000
      max: 8999
    marker:
      type: choice
      choices:
      - state-1d44
      - state-8be2
      - state-a903
      - state-5c7f
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: PVC {{app}}-data is Bound and holds /state.txt ('keep-{{marker}}'). PVC {{app}}-scratch is a second, empty claim. Deployment {{app}} serves /data but mounts a non-existent claim {{app}}-state, so its pod is Pending.
  fixtures:
  - fixtures/pvcs.yaml
  - fixtures/writer.yaml
  - fixtures/service.yaml
  - fixtures/deployment.yaml
  faults:
  - id: wrong_claim_reference
    category: wrong-reference
    layer: storage
    description: volume references PVC {{app}}-state, which does not exist
constraints:
- id: keep_claims
  description: Do not delete or modify the existing claims.
  enforced_by: invariant
  invariant: claims_intact
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: data_served
  kind: goal
  required: true
  description: The Service returns the saved data /state.txt
- id: rollout_healthy
  kind: goal
  required: true
  description: Deployment rollout complete
- id: claims_intact
  kind: guard
  required: true
  description: Both PVCs unchanged, data claim still Bound
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - data_served
    - rollout_healthy
    must_pass:
    - claims_intact
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-empty-claim.sh
  - reference/wrong-emptydir.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
