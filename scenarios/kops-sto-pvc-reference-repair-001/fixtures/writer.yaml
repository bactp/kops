apiVersion: v1
kind: Pod
metadata: {name: writer, namespace: "{{ns}}"}
spec:
  containers:
    - name: w
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo keep-{{marker}} > /data/state.txt; sleep 3600"]
      volumeMounts:
        - {name: d, mountPath: /data}
  volumes:
    - name: d
      persistentVolumeClaim: {claimName: "{{app}}-data"}
