apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-mc-sidecar-log-stream-001
criteria:
  - id: sidecar_exists
    invariant: sidecar_streams
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[?(@.name=="{{sc}}")].image', op: eq, value: busybox:1.36.1}

  - id: sidecar_logs
    invariant: sidecar_streams
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.logs, resource: {kind: Pod, selector: "app={{app}}", namespace: "{{ns}}"}, container: "{{sc}}", regex: "^event [0-9]+", min_matches: 3}

  - id: main_image
    invariant: main_container_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[?(@.name=="web")].image', op: eq, value: busybox:1.36.1}

  - id: main_mount
    invariant: main_container_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[?(@.name=="web")].volumeMounts[0].mountPath', op: eq, value: /var/log/app}

  - id: main_cmd
    invariant: main_container_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[?(@.name=="web")].command[2]', op: regex, value: event}
