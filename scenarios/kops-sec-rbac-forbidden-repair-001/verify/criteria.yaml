apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-sec-rbac-forbidden-repair-001
criteria:
  - id: can_get_dep
    invariant: deploy_access_works
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: get, resource: deployments.apps, expect: allow, namespace: "{{ns}}"}

  - id: can_list_dep
    invariant: deploy_access_works
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: list, resource: deployments.apps, expect: allow, namespace: "{{ns}}"}

  - id: can_patch_dep
    invariant: deploy_access_works
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: patch, resource: deployments.apps, expect: allow, namespace: "{{ns}}"}

  - id: can_scale_dep
    invariant: deploy_access_works
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: update, resource: deployments.apps, expect: allow, namespace: "{{ns}}", subresource: scale}

  - id: cannot_delete_dep
    invariant: no_excess_access
    required: true
    failure_class: constraint-violation
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: delete, resource: deployments.apps, expect: deny, namespace: "{{ns}}"}

  - id: cannot_read_secrets
    invariant: no_excess_access
    required: true
    failure_class: constraint-violation
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: get, resource: secrets, expect: deny, namespace: "{{ns}}"}

  - id: cannot_patch_elsewhere
    invariant: no_excess_access
    required: true
    failure_class: constraint-violation
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: patch, resource: deployments.apps, expect: deny, namespace: "kube-system"}

  - id: cannot_create_pods
    invariant: no_excess_access
    required: true
    failure_class: constraint-violation
    check: {type: k8s.can_i, as: "system:serviceaccount:{{ns}}:{{sa}}", verb: create, resource: pods, expect: deny, namespace: "{{ns}}"}
