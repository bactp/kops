apiVersion: kops/v1alpha1
kind: Scenario
id: ckad-sec-serviceaccount-workload-001
revision: 1
title: Run a Deployment under a dedicated ServiceAccount without an API token
status: validated
family_id: PF-SEC-004
difficulty:
  level: 2
  rationale: Needs a new ServiceAccount, wiring it into the pod template and disabling token automount at pod level.
tags:
- serviceaccount
- automount
- deployment
profiles:
  cka:
    enabled: false
  ckad:
    enabled: true
    domain: environment-config-security
    primary_competency: CKAD-AEC-07
    mapping_rationale: Creating and attaching ServiceAccounts is the ServiceAccounts competency.
backend:
  class: kind
  kubernetes_version: '1.35'
  topology:
    control_planes: 1
    workers: 0
  features: []
  isolation: cluster
task:
  statement_file: task.md
  parameters:
    ns:
      type: dns-label
      prefix: ident-
    app:
      type: choice
      choices:
      - importer
      - uploader
      - cleaner
    port:
      type: port
      min: 8000
      max: 8999
    sa:
      type: choice
      choices:
      - importer-runtime
      - uploader-sa
      - worker-identity
  agent_context:
    default_namespace: '{{ns}}'
interfaces:
  allowed:
  - kubectl
  forbidden:
  - shell
  - file-write
  - internet
  - ssh
  agent_identity:
    kind: cluster-admin
  node_access: none
initial_state:
  description: Deployment {{app}} (2 replicas) runs with the namespace's default ServiceAccount and auto-mounted API token.
  fixtures:
  - fixtures/deployment.yaml
  faults:
  - id: default_identity
    category: misconfiguration
    layer: object
    description: workload uses default SA with token mount
constraints:
- id: same_workload
  description: Keep the same Deployment, image and replicas.
  enforced_by: invariant
  invariant: workload_preserved
budgets:
  max_steps: 40
  max_wall_seconds: 900
  per_action_timeout_seconds: 60
  max_output_bytes_per_action: 8192
expected_invariants:
- id: dedicated_identity
  kind: goal
  required: true
  description: Pods run as the new ServiceAccount, which exists
- id: no_token_mount
  kind: goal
  required: true
  description: Pod template disables API token automount
- id: rollout_complete
  kind: goal
  required: true
  description: Rollout finished with all replicas ready
- id: workload_preserved
  kind: guard
  required: true
  description: Deployment UID, image and replicas unchanged
setup:
  script: setup/setup.sh
  timeout_seconds: 240
  executes_on: runner
  confirm:
    must_fail:
    - dedicated_identity
    - no_token_mount
    must_pass:
    - rollout_complete
    - workload_preserved
verification:
  engine: kops-verifier/v1
  criteria_file: verify/criteria.yaml
  entrypoint: verify/verify.sh
  pass_rule: all-required
  settle:
    max_wait_seconds: 60
    poll_interval_seconds: 3
  timeout_seconds: 240
  credentials: verifier-admin
reset:
  strategy: destroy-cluster
  verify_baseline: true
reference:
  solution: reference/solution.sh
  exposure: hidden
  negative_solutions:
  - reference/wrong-sa-only.sh
  - reference/wrong-automount-only.sh
metadata:
  kubernetes_version: '1.35'
  competency_model: kops-competency/v1.35-r1
  authors:
  - kops-a2-team
  created: '2026-10-02'
  provenance:
    file: metadata/provenance.yaml
    copied_question: false
    authored_clean_room: true
