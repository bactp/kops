apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-net-nodeport-expose-001
criteria:
  - id: svc_type
    invariant: nodeport_service_ok
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Service, name: "{{app}}-public", namespace: "{{ns}}"}, jsonpath: '.spec.type', op: eq, value: NodePort}

  - id: svc_port
    invariant: nodeport_service_ok
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Service, name: "{{app}}-public", namespace: "{{ns}}"}, jsonpath: '.spec.ports[0].port', op: eq, value: 80}

  - id: svc_target
    invariant: nodeport_service_ok
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Service, name: "{{app}}-public", namespace: "{{ns}}"}, jsonpath: '.spec.ports[0].targetPort', op: eq, value: {{port}}}

  - id: svc_nodeport
    invariant: nodeport_service_ok
    required: true
    failure_class: goal-not-reached
    check: {type: k8s.field, resource: {kind: Service, name: "{{app}}-public", namespace: "{{ns}}"}, jsonpath: '.spec.ports[0].nodePort', op: eq, value: {{np}}}

  - id: endpoints_ready
    invariant: service_serves
    required: true
    settle: true
    failure_class: goal-not-reached
    check: {type: k8s.endpoints, service: "{{app}}-public", namespace: "{{ns}}", min_ready: 2, port: {{port}}}

  - id: http_via_service
    invariant: service_serves
    required: true
    settle: true
    failure_class: goal-not-reached
    check:
      type: net.http
      from: {namespace: kops-probe}
      url: "http://{{app}}-public.{{ns}}.svc.cluster.local/"
      expect: reachable
      status: 200
      body_regex: '^exposed-ok\s*$'
      attempts: 3
      timeout_seconds: 3

  - id: template_unchanged
    invariant: deployment_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.unchanged, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, scope: jsonpaths, jsonpaths: [.spec.template, .spec.replicas], baseline: post-setup}
