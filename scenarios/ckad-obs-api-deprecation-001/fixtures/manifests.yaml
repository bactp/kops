apiVersion: v1
kind: ConfigMap
metadata: {name: release-manifests, namespace: "{{ns}}"}
data:
  hpa.yaml: |
    apiVersion: autoscaling/v2beta2
    kind: HorizontalPodAutoscaler
    metadata: {name: web, namespace: "{{ns}}"}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
      minReplicas: 2
      maxReplicas: 5
  pdb.yaml: |
    apiVersion: policy/v1beta1
    kind: PodDisruptionBudget
    metadata: {name: web, namespace: "{{ns}}"}
    spec:
      minAvailable: 1
      selector: {matchLabels: {app: web}}
  cronjob.yaml: |
    apiVersion: batch/v1beta1
    kind: CronJob
    metadata: {name: report, namespace: "{{ns}}"}
    spec:
      schedule: "0 3 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: Never
              containers: [{name: r, image: "busybox:1.36.1", command: [echo, done]}]
  flowschema.yaml: |
    apiVersion: flowcontrol.apiserver.k8s.io/v1beta3
    kind: FlowSchema
    metadata: {name: web-low}
    spec:
      priorityLevelConfiguration: {name: workload-low}
      rules: [{subjects: [{kind: Group, group: {name: "system:authenticated"}}], resourceRules: [{verbs: ["*"], apiGroups: ["*"], resources: ["*"], namespaces: ["*"]}]}]
