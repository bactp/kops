apiVersion: kops/v1alpha1
kind: Criteria
scenario: kops-obs-probe-startup-001
criteria:
  - id: ready_over_time
    invariant: pods_stable
    required: true
    settle: true
    failure_class: unstable
    check: {type: stability, window_seconds: 15, samples: 4, check: {type: k8s.count, resource: {kind: Pod, selector: "app={{app}}", namespace: "{{ns}}"}, field_filter: ".status.containerStatuses[0].ready==true", op: eq, value: 2}}

  - id: no_restarts
    invariant: pods_stable
    required: true
    settle: true
    failure_class: unstable
    check: {type: k8s.field, resource: {kind: Pod, selector: "app={{app}}", namespace: "{{ns}}"}, jsonpath: ".status.containerStatuses[0].restartCount", op: lte, value: 0}

  - id: liveness_path
    invariant: liveness_kept
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.template.spec.containers[0].livenessProbe.httpGet.path', op: eq, value: /healthz}

  - id: replicas_two
    invariant: replicas_unchanged
    required: true
    failure_class: constraint-violation
    check: {type: k8s.field, resource: {kind: Deployment, name: "{{app}}", namespace: "{{ns}}"}, jsonpath: '.spec.replicas', op: eq, value: 2}
