apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}
  namespace: {{ns}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{app}}}
  template:
    metadata:
      labels: {app: {{app}}}
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep {{delay}}; mkdir -p /tmp/w; echo ok > /tmp/w/healthz; echo started > /tmp/w/index.html; exec httpd -f -p {{port}} -h /tmp/w"]
          livenessProbe:
            httpGet: {path: /healthz, port: {{port}}}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet: {path: /healthz, port: {{port}}}
            periodSeconds: 2
