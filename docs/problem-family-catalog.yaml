  evidence_examples: [grindxhq-cka:s4-11, ck-x:cka-002/Q18, cka-hand-on-lab:wrk-003]
  environment: Deployment with >=3 revisions, the latest broken (bad image or failing probe)
  invariants: [k8s.rollout_complete, "k8s.field image == known-good revision image", "k8s.count ready pods", "k8s.unchanged Service"]
  backend: {class: kind, features: []}
  contamination_risk: medium
  contamination_notes: Parameterize revision count and which revision is "good" so recall of "undo" is insufficient.

