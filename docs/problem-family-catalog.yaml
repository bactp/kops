# KOPS Problem-Family Catalog (C)
#
# Purpose: competency-level problem families extracted from 8 audited reference
# repositories (~1,000 tasks) and deduplicated semantically. This is NOT a
# question bank; no reference task text is reproduced. Families are the unit
# for coverage planning; KOPS scenarios are authored clean-room per family.
#
# Conventions
#   family_id           PF-<AREA>-<NNN>; AREA is topical, not certification-bound.
#   modes               create | modify | repair | diagnose. Variants that differ only
#                       in mode stay in ONE family unless the primary competency changes
#                       (e.g. "configure Service" -> CKA-NET-03, "repair Service routing"
#                       -> CKA-TRB-05 are separate families).
#   profiles            default mapping: exactly one domain + competency per applicable
#                       profile (competency ids: docs/competency-model.yaml). A scenario may
#                       override with justification (scenario.yaml mapping_rationale).
#                       `null` = profile not applicable.
#   reference_repositories  repos containing >=1 task of this family.
#   quarantined_topic_sources  repos/items that ALSO contain the family but are
#                       quarantined (ckad-dojo, ckad-2026 Q01-Q16): recorded for
#                       completeness of the audit; they contributed NOTHING beyond the
#                       topic label, which is already in the public curriculum.
#   evidence_examples   non-quarantined task ids for traceability (repo:id).
#   invariants          candidate deterministic invariants (see criteria.schema.json types).
#   backend             minimum KOPS backend class + required features.
#   contamination_risk  risk that a NAIVE scenario in this family reproduces memorized
#                       surface forms (low | medium | high); mitigation in notes.
#
# Source commits: see docs/reference-inventory.csv.
# Competency model: kops-competency/v1.35-r1.

catalog_version: pf-v0.1
competency_model: kops-competency/v1.35-r1
generated: "2026-09-26"

families:

# ───────────────────────── Workloads & deployment (WKL) ─────────────────────────
- family_id: PF-WKL-001
  name: Create or configure a Deployment (replicas, labels, ports, template)
  modes: [create, modify]
  profiles:
    cka:  {domain: workloads-scheduling, competency: CKA-WLS-04}
    ckad: {domain: design-build, competency: CKAD-ADB-02}
  reference_repositories: [grindxhq-cka, k16s, ck-x, cka-hand-on-lab, ckad-exams, ckad-exercises, ckad-2026]
  quarantined_topic_sources: [ckad-dojo]
  evidence_examples: [grindxhq-cka:s1-02, ck-x:ckad-001/Q1, ckad-2026:Q31]
  environment: namespace; pinned app image that serves HTTP
  invariants: [k8s.rollout_complete, "k8s.field replicas/labels/containerPort", "net.http via pod IP or Service"]
  backend: {class: kind, features: []}
  contamination_risk: high
  contamination_notes: Canonical "nginx deployment with N replicas" is heavily memorized; use seeded names/images/ports and combine with a non-trivial constraint.

- family_id: PF-WKL-002
  name: Configure rollout strategy (RollingUpdate maxSurge/maxUnavailable, Recreate, minReadySeconds)
  modes: [modify]
  profiles:
    cka:  {domain: workloads-scheduling, competency: CKA-WLS-01}
    ckad: {domain: deployment, competency: CKAD-ADP-02}
  reference_repositories: [grindxhq-cka, cka-hand-on-lab, ckad-exams, ckad-2026, ckad-exercises]
  quarantined_topic_sources: [ckad-dojo]
  evidence_examples: [grindxhq-cka:s2-16, cka-hand-on-lab:wrk-001, ckad-2026:Q37]
  environment: existing Deployment
  invariants: ["k8s.field .spec.strategy", "k8s.unchanged template (when only strategy should change)"]
  backend: {class: kind, features: []}
  contamination_risk: medium
  contamination_notes: Spec-only; strengthen by requiring an observed zero-downtime rollout (stability of available replicas).

- family_id: PF-WKL-003
