  evidence_examples: [grindxhq-cka:s3-01, grindxhq-cka:s4-02, k16s:cka/06]
  environment: node access to control plane; etcdctl/etcdutl
  invariants: ["artifact(node): verifier runs etcdutl snapshot status -> valid, revision >= setup marker revision", "artifact contains seeded marker key (verifier restores snapshot into scratch dir and reads key)"]
  backend: {class: kind-node, features: []}
